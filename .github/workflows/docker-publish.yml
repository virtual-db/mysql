# =============================================================================
# virtual-db/mysql — .github/workflows/docker-publish.yml
#
# Builds the vdb-mysql Docker image and publishes it to the GitHub Container
# Registry (ghcr.io) AND registry.vdbm.io whenever a release is published.
#
# Images:
#   - ghcr.io/virtual-db/mysql
#   - registry.vdbm.io/virtual-db/mysql
#
# Tags (applied to both registries):
#   - Full semver:     :v0.0.1-alpha.2
#   - Major.minor:     :v0.0  (stable releases only)
#   - latest:          :latest (stable releases only)
# =============================================================================

name: Publish Docker image to GHCR and registry.vdbm.io

on:
  release:
    types: [published]

env:
  GHCR_REGISTRY: ghcr.io
  VDBM_REGISTRY: registry.vdbm.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to registry.vdbm.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.VDBM_REGISTRY }}
          username: ${{ secrets.VDBM_REGISTRY_TOKEN }}
          password: ${{ secrets.VDBM_REGISTRY_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.VDBM_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Exact release tag — always applied (e.g. v0.0.1-alpha.2)
            type=ref,event=tag
            # SemVer rules — major.minor and latest only for stable releases
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in the GHCR cache to speed up subsequent builds.
          cache-from: type=registry,ref=${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
